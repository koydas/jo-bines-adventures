<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141018" />
    <meta name="description" content="Les Aventures de Jo Bine — un boy qui affronte des squelettes." />

    <!-- iOS "Add to Home Screen" support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jo Bine" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Les Aventures de Jo Bine</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #141018;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }
      canvas {
        touch-action: none;
      }

      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: max(10px, env(safe-area-inset-top));
      }
      #rotate-hint span {
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 999px;
      }
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-hint"><span>🔄 Tourne ton téléphone pour une meilleure vue</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
