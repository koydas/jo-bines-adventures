apiVersion: apps/v1
kind: Deployment
metadata:
  name: jo-bines-adventures
  labels:
    app.kubernetes.io/name: jo-bines-adventures
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jo-bines-adventures
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jo-bines-adventures
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Tag is rewritten to the built commit SHA by the docker-publish
          # workflow on every push to master; see .github/workflows/docker-publish.yml.
          image: ghcr.io/koydas/jo-bines-adventures:49e3f6c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # The root filesystem is read-only: Nginx needs these three
            # writable paths.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
