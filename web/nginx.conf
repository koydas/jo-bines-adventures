server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite's own bundle (dist/assets/index-<hash>.js, filename changes
    # with content) is safe to cache forever. This regex location is
    # checked before the plain-prefix one below regardless of order, so it
    # only intercepts hashed files directly under /assets/ — not the
    # sprite PNGs one level down (/assets/character/..., /assets/ui/...).
    location ~ ^/assets/[^/]+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sprite PNGs copied verbatim from public/assets/ (see
    # scripts/extract_sprites.py) are NOT content-hashed — a redeploy that
    # changes a sprite reuses the same URL, so this must not be cached
    # `immutable`. A day is long enough to matter for repeat visits while
    # still picking up a changed sprite on the next one.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Never cache the manifest or the shell HTML, so updates roll out immediately.
    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
