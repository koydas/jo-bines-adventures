name: docker-publish

on:
  push:
    branches: [master]
    paths-ignore:
      - '_legacy/**'
      - 'web/k8s/**'
      - 'web/docs/**'
      - '**.md'

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-master
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # Gate the deploy on the fast smoke suite, not the slower
      # controls-driven E2E suite (which already runs on its own on every
      # push via .github/workflows/e2e-tests.yml as a non-blocking safety
      # net) -- see docs/adr/0024-onboard-jo-bines-adventures.md in
      # gitops-homelab.
      - run: npx playwright test tests/smoke.spec.ts

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Full history (not the default single-commit shallow clone) so the
      # merge-base ancestry check below can actually compare this run's
      # commit against whatever short SHA is currently deployed on master.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tag
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/koydas/jo-bines-adventures:${{ steps.vars.outputs.sha }}
            ghcr.io/koydas/jo-bines-adventures:latest

      # Bumping the tag here (rather than leaving the Deployment on :latest)
      # is what makes this a Git commit ArgoCD can actually sync on -- same
      # recipe as healing-simulator's docker-publish.yml.
      #
      # Unlike healing-simulator, `master` on this repo carries NO branch
      # protection (checked 2026-08-14), so this pushes the bump directly
      # instead of opening+auto-merging a PR. If branch protection is ever
      # turned on here, switch to the PR-based approach (see
      # healing-simulator's workflow and its ADR-0014) -- a direct push
      # would then be rejected.
      - name: Bump the deployed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git reset --hard origin/master

          # Same staleness guard as healing-simulator: if master is already
          # at or ahead of this run's commit, skip instead of deploying an
          # older image over a newer one.
          DEPLOYED_SHA=$(grep -oE 'jo-bines-adventures:[0-9a-f]+' k8s/deployment.yaml | cut -d: -f2)
          if [ -n "$DEPLOYED_SHA" ] && git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "${{ github.sha }}" "$DEPLOYED_SHA"; then
              echo "master is already deployed at $DEPLOYED_SHA (at or ahead of this run's commit ${{ github.sha }}). Skipping."
              exit 0
            fi
          fi

          sed -i "s|ghcr.io/koydas/jo-bines-adventures:.*|ghcr.io/koydas/jo-bines-adventures:${{ steps.vars.outputs.sha }}|" k8s/deployment.yaml
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest change, skipping deploy commit."
            exit 0
          fi
          git commit -m "chore: deploy ${{ steps.vars.outputs.sha }}"
          git push origin HEAD:master
